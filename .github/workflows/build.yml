name: build

# Reconstructs SexLabPPrism.dll 0.6.1 for Skyrim AE
# and packages it as an Amethyst-installable mod.
#
# The original plugin is closed source and ships against an Address Library it
# refuses to read on 1.7.104. This build uses the LATEST alandtse/CommonLibVR
# `ng` HEAD and refuses to compile unless that revision contains
# include/REL/IDDB.h with the `Format::SSEv5` enumerator (Address Library
# format 5), which is what versionlib-1-7-104-0.bin is.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commonlib_ref:
        description: "Build job: optional CommonLibVR commit/ref to pin (default: latest ng HEAD)"
        required: false
        default: ""
      parity_commonlib_ref:
        description: "Parity job: override the pinned-era CLNG ref (default: 1cc6b3999). Prints a warning; the era gate still runs."
        required: false
        default: ""
      spdlog_version:
        description: "Parity sweep: spdlog version, e.g. v1.15.2 (default/empty = CLNG's v1.16.0)"
        required: false
        default: ""
      directxmath_version:
        description: "Parity sweep: DirectXMath version, e.g. 2024.02 (default/empty = CLNG's 2024.02)"
        required: false
        default: ""
      directxtk_version:
        description: "Parity sweep: DirectXTK version, e.g. 24.2.0 (default/empty = CLNG's 24.2.0)"
        required: false
        default: ""
      rapidcsv_version:
        description: "Parity sweep: rapidcsv version, e.g. v8.92 (default/empty = CLNG's v8.92)"
        required: false
        default: ""
      lto_scope:
        description: "Parity sweep: LTCG scope - off (default: no /GL, matches the original's log/call shapes), target (our TUs /GL), clng (CLNG only), project (both)"
        required: false
        default: ""
      xmake_repo_ref:
        description: "Parity sweep: xmake-repo commit to check out before configuring (default/empty = image's repo)"
        required: false
        default: ""
      parity_link_map:
        description: "Parity job: 1 = emit the /MAP symbol oracle (default), 0 = omit it. Use 0 for the /MAP binary-neutrality A/B against a run with 1 on the same commit."
        required: false
        default: "1"

permissions:
  contents: read

env:
  COMMONLIB_REPO: https://github.com/alandtse/CommonLibVR.git
  COMMONLIB_BRANCH: ng

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and check out the LATEST CommonLibSSE-NG `ng` HEAD
        shell: bash
        run: |
          set -euo pipefail
          rm -rf lib/CommonLibSSE-NG
          mkdir -p lib
          if [ -n "${{ github.event.inputs.commonlib_ref || '' }}" ]; then
            ref="${{ github.event.inputs.commonlib_ref }}"
            echo "Pinned CommonLibVR ref requested: $ref"
            # Works for a branch, tag or raw commit SHA (--branch rejects SHAs).
            git init lib/CommonLibSSE-NG
            git -C lib/CommonLibSSE-NG remote add origin "$COMMONLIB_REPO"
            git -C lib/CommonLibSSE-NG fetch --depth 1 origin "$ref"
            git -C lib/CommonLibSSE-NG checkout --detach FETCH_HEAD
          else
            # Latest ng HEAD, resolved dynamically. The user's standing rule is
            # to build against the newest CommonLibSSE-NG, never an older pin.
            remote_head=$(git ls-remote "$COMMONLIB_REPO" "refs/heads/$COMMONLIB_BRANCH" | awk '{print $1}')
            [ -n "$remote_head" ] || { echo "::error::could not resolve $COMMONLIB_BRANCH HEAD"; exit 1; }
            echo "Latest $COMMONLIB_BRANCH HEAD on the remote: $remote_head"
            git clone --depth 1 --branch "$COMMONLIB_BRANCH" "$COMMONLIB_REPO" lib/CommonLibSSE-NG
            local_head=$(git -C lib/CommonLibSSE-NG rev-parse HEAD)
            [ "$local_head" = "$remote_head" ] || {
              echo "::error::checked out $local_head but remote HEAD is $remote_head"; exit 1; }
          fi
          echo "COMMONLIB_REV=$(git -C lib/CommonLibSSE-NG rev-parse HEAD)" >> "$GITHUB_ENV"
          # CLNG's headers include <openvr.h>. When the checkout is a clean release
          # tag its xmake.lua downloads a prebuilt bundle carrying those headers;
          # when the branch tip is NOT a tagged commit it builds from source and
          # needs the submodule on disk. The `ng` tip is not always a tag, so
          # always initialise it and fail loudly if it is missing - otherwise the
          # job dies mid-compile with "Cannot open include file: 'openvr.h'"
          # from RE/B/BSVRInterface.h.
          git -C lib/CommonLibSSE-NG submodule update --init extern/openvr
          test -f lib/CommonLibSSE-NG/extern/openvr/headers/openvr.h || {
            echo "::error::openvr headers are missing; the source build needs them"; exit 1; }

      - name: Assert format-5 (SSEv5) address library support
        shell: bash
        run: python tools/check_commonlib.py lib/CommonLibSSE-NG

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Cache xmake packages
        uses: actions/cache@v4
        with:
          path: ~/.xmake
          key: xmake-pkgs-${{ runner.os }}-${{ hashFiles('xmake.lua') }}
          restore-keys: xmake-pkgs-${{ runner.os }}-

      - name: Build SexLabPPrism.dll
        shell: pwsh
        run: |
          xmake f -p windows -a x64 -m release -y
          xmake build SexLabPPrism
          Get-ChildItem -Recurse -Filter SexLabPPrism.dll | Select-Object FullName, Length

      - name: Package the mod zip
        shell: bash
        run: |
          set -euo pipefail
          # SKSE/Plugins/SexLabPPrism.dll at the archive ROOT (no wrapper folder),
          # so Amethyst's "Mods -> Install mod from file..." needs no manual placement.
          mkdir -p out/SKSE/Plugins
          dll=$(find build -name SexLabPPrism.dll -type f | head -1)
          [ -n "$dll" ] || { echo "::error::SexLabPPrism.dll not found"; exit 1; }
          cp "$dll" out/SKSE/Plugins/
          cat > out/README-PORT.txt <<EOF
          SexLab P+ Prism 0.6.1 - from-binary reconstruction for Skyrim AE 1.7.104
          =====================================================================

          Contains one file: SKSE/Plugins/SexLabPPrism.dll

          What this is: the original SexLab Prism ships compiled only, with no
          public source. This is a clean-room reconstruction of its SKSE plugin
          surface (the three SKSE exports and the 13 Papyrus natives of the
          SexLabPrismNative script), built against the LATEST CommonLibSSE-NG
          so that it can read Address Library format 5
          (Data/SKSE/Plugins/versionlib-1-7-104-0.bin), which the original
          rejects with "Unsupported address library format".

          CommonLibSSE-NG revision: ${COMMONLIB_REV}
          Build source license: reconstruction; upstream CommonLibSSE-NG is
          Apache-2.0. The original SexLab Prism is closed source, so this mod is
          unofficial and is not a byte-for-byte reproduction.

          Status: the plugin compiles, loads, creates SexLabPPrism.log and
          registers the natives. The 13 natives are IMPLEMENTED from the
          reconstructed contract: scene-session tracking, the JSON scene-state
          protocol with stale-update rejection, free-camera detection, and the
          animation catalogue (128-byte records, FNV-1a id index, package
          mapping, publishing) plus search-query forwarding. The PrismaUI web
          view bridge is scaffolding only - the interface layout is unconfirmed,
          so UI calls are logged rather than executed and the scene UI is NOT
          reproduced yet. Expect the plugin to load and log, not to replace
          SexLab's scene menu.

          Install: Amethyst: Mods -> Install mod from file..., then let this mod
          overwrite the original Prism mod (only SKSE/Plugins/SexLabPPrism.dll
          conflicts). Vortex/MO2: install and let it overwrite.
          EOF
          (cd out && 7z a "../SexLabPPrism-0.6.1-1.7.104.zip" SKSE README-PORT.txt)
          ls -l SexLabPPrism-0.6.1-1.7.104.zip

      - name: Report hashes
        shell: bash
        run: |
          sha256sum out/SKSE/Plugins/SexLabPPrism.dll | sed 's/^/  dll  /'
          sha256sum SexLabPPrism-0.6.1-1.7.104.zip | sed 's/^/  zip  /'
          echo "  commonlib  $COMMONLIB_REV"

      - uses: actions/upload-artifact@v4
        with:
          name: SexLabPPrism-0.6.1-1.7.104
          path: SexLabPPrism-0.6.1-1.7.104.zip

  # ---------------------------------------------------------------------------
  # Parity build: a MEASUREMENT INSTRUMENT, not a shipping artifact.
  #
  # It exists so tools/parity.py can compare our machine code with the original
  # DLL function by function, so it deliberately reproduces the original's build
  # environment: the same CommonLibSSE-NG era (pre-Address-Library-format-5) and
  # the same MSVC 14.44 toolset, plus /O2, /Gy, LTCG and the VERSIONINFO
  # resource. That combination is precisely what CANNOT read
  # versionlib-1-7-104-0.bin, so a binary from this job must never be installed;
  # the `build` job above is the one that ships and it always uses the LATEST
  # CommonLibSSE-NG.
  # ---------------------------------------------------------------------------
  parity:
    runs-on: windows-2022
    env:
      # `ng` HEAD at the original binary's own timestamp (2026-07-19).
      COMMONLIB_PARITY_REV: 1cc6b3999eb92b4d86fe08be28011ba679980081
      # target | clng | project | off. See build/xmake.lua.
      #
      # 2026-09-21 (grind/logshape): the parity job used to default to
      # `target` (/GL on our TUs). Measured against `off` that is WRONG:
      # every no-LTO parity artifact (ci-parity/SexLabPPrism-parity.dll,
      # 933/1495 real BYTE) carries the original's call shapes, while every
      # /GL artifact (parity-lto*, parity-r3..r7, 847/848) does not:
      #   * spdlog `log_<Args>`: no-LTO = 19 generic bodies, 0 specialised;
      #     /GL = 9 generic, 16-18 clones with the level constant folded
      #     (`cmp ebx,0x2`) -- the original is 21 generic, 0 specialised.
      #   * `_Mtx_lock`: no-LTO = 30/30 direct calls to the `jmp [IAT]`
      #     thunk, 0 direct-IAT; /GL = 16 thunk + 21 direct-IAT; the original
      #     is 37/37 thunk, 0 direct-IAT.
      # So the link-shape differences are an LTCG regression, not a missing
      # flag. The `target` scoreboard number was only ever compared against
      # other /GL scopes; the no-LTO parity score (933) was never used as the
      # oracle. Default the parity job to `off`; the other scopes stay
      # selectable for the sweep.
      PRISM_LTO_SCOPE: ${{ github.event.inputs.lto_scope || 'off' }}
      # Measurement instrument, not parity config: emit SexLabPPrism.map beside
      # the parity DLL so tools/match.py --map can bind declarations by exact
      # symbol. /MAP writes a text side-file only and does not change the image.
      # The shipping `build` job does NOT set this.
      PRISM_LINK_MAP: ${{ github.event.inputs.parity_link_map || '1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the original-era CommonLibSSE-NG
        shell: bash
        run: |
          set -euo pipefail
          ref="${{ github.event.inputs.parity_commonlib_ref || '' }}"
          if [ -z "$ref" ]; then
            ref="$COMMONLIB_PARITY_REV"
          else
            echo "::warning::parity CommonLib ref OVERRIDDEN to $ref; the pinned era is $COMMONLIB_PARITY_REV"
          fi
          echo "parity CommonLib ref: $ref"
          rm -rf lib/CommonLibSSE-NG
          mkdir -p lib
          git init lib/CommonLibSSE-NG
          git -C lib/CommonLibSSE-NG remote add origin "$COMMONLIB_REPO"
          git -C lib/CommonLibSSE-NG fetch --depth 1 origin "$ref"
          git -C lib/CommonLibSSE-NG checkout --detach FETCH_HEAD
          echo "COMMONLIB_REV=$(git -C lib/CommonLibSSE-NG rev-parse HEAD)" >> "$GITHUB_ENV"
          # CLNG's headers include <openvr.h>, which the prebuilt bundle used to
          # supply. Building from source needs the submodule on disk.
          git -C lib/CommonLibSSE-NG submodule update --init extern/openvr
          test -f lib/CommonLibSSE-NG/extern/openvr/headers/openvr.h || {
            echo "::error::openvr headers are missing; the source build needs them"; exit 1; }
          # Drop the git metadata BEFORE configuring. The pinned commit happens to
          # be the v4.38.0 release tag, and CLNG's xmake.lua auto-downloads that
          # release's prebuilt static library in CI - a bundle built by the
          # maintainers' newer toolset. Linking it with the 14.44 linker fails on
          # an MSVC STL-internal symbol (LNK2001: __std_regex_transform_primary_char)
          # even though every one of our own translation units is built by 14.44.
          # With no .git directory, CLNG's `git describe --tags --exact-match` fails
          # and it compiles from source with our toolset - which is what the
          # original did - instead of silently mixing in a foreign prebuilt.
          rm -rf lib/CommonLibSSE-NG/.git

      - name: Assert the checkout is the pre-format-5 era
        shell: bash
        run: python tools/check_commonlib_parity.py lib/CommonLibSSE-NG

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Resolve dependency-pin overrides (parity sweep)
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "PRISM_SPDLOG_VERSION=${{ github.event.inputs.spdlog_version || '' }}"
            echo "PRISM_DIRECTXMATH_VERSION=${{ github.event.inputs.directxmath_version || '' }}"
            echo "PRISM_DIRECTXTK_VERSION=${{ github.event.inputs.directxtk_version || '' }}"
            echo "PRISM_RAPIDCSV_VERSION=${{ github.event.inputs.rapidcsv_version || '' }}"
          } >> "$GITHUB_ENV"
          for v in PRISM_SPDLOG_VERSION PRISM_DIRECTXMATH_VERSION PRISM_DIRECTXTK_VERSION PRISM_RAPIDCSV_VERSION; do
            val="${!v:-}"
            if [ -n "$val" ]; then echo "$v override -> $val"; else echo "$v unset (CLNG pin)"; fi
          done

      - name: Pin the xmake-repo package recipes
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.xmake_repo_ref != '' }}
        shell: bash
        run: |
          set -euo pipefail
          repo="$HOME/.xmake/repositories/xmake-repo"
          [ -d "$repo/.git" ] || xmake repo -u
          git -C "$repo" fetch --filter=blob:none origin master
          git -C "$repo" checkout --detach "${{ github.event.inputs.xmake_repo_ref }}"
          git -C "$repo" rev-parse HEAD

      - name: Build with the original toolset (MSVC 14.44)
        shell: cmd
        run: |
          rem windows-2022 ships VS 2022, whose default toolset IS 14.44 - the
          rem toolset the original was linked with. Letting xmake detect that
          rem consistently for every target matters: forcing vcvarsall for 14.44
          rem while xmake detected the VS 2026 image elsewhere produced CLNG
          rem objects built from newer STL headers, which then failed to resolve
          rem internal STL symbols at LTCG time. The check_linker gate below
          rem proves which toolset actually produced the binary.
          xmake f -p windows -a x64 -m release -y
          rem Keep the verbose log on disk so the staging step can prove the
          rem /MAP token really is on link.exe's command line, instead of
          rem trusting that the flag was accepted. Tee it back to the console so
          rem CI still shows the full build.
          xmake build -v SexLabPPrism > parity-build-verbose.log 2>&1
          set "prism_rc=%errorlevel%"
          type parity-build-verbose.log
          if not "%prism_rc%"=="0" exit /b %prism_rc%
      - name: Assert the toolset actually matched, and stage the DLL
        shell: bash
        run: |
          set -euo pipefail
          dll=$(find build -name SexLabPPrism.dll -type f | head -1)
          [ -n "$dll" ] || { echo "::error::SexLabPPrism.dll not found"; exit 1; }
          python tools/check_linker.py "$dll" 14.44
          mkdir -p parity-out
          cp "$dll" parity-out/SexLabPPrism-parity.dll
          # The symbol oracle for tools/match.py --map. With PRISM_LINK_MAP=1
          # fail loudly if /MAP did not produce it: without it every declared
          # row falls back to the similarity screen.  PRISM_LINK_MAP=0 is the
          # neutrality A/B (same commit, no map): no oracle, no failure.
          if [ "${PRISM_LINK_MAP:-1}" = "1" ]; then
            # Prove the flag reached the linker BEFORE trusting the map's
            # absence to mean the branch did not run.  The previous parity run
            # (35663144070) printed "[prism] parity linker map enabled (/MAP)"
            # and still linked without it, because a DLL target reads xmake's
            # `shflags`, not `ldflags`.
            if [ ! -f parity-build-verbose.log ]; then
              echo "::error::parity-build-verbose.log is missing; cannot prove /MAP reached link.exe"
              exit 1
            fi
            mapflag=$(grep -oE '/MAP:[^ "]*' parity-build-verbose.log | head -1)
            if [ -z "$mapflag" ]; then
              echo "::error::/MAP token missing from the logged link.exe command line (/MAP did not reach the linker)"
              echo "  link.exe line(s) from the build log:"
              grep -n 'link\.exe' parity-build-verbose.log | tail -3 || true
              exit 1
            fi
            echo "  link line /MAP evidence: $mapflag"
            # The map may land beside the DLL, in the linker's cwd, or anywhere
            # under the build tree: search the whole tree and say where.
            map=$(find build -name SexLabPPrism.map -type f 2>/dev/null | head -1)
            if [ -z "$map" ]; then
              echo "::error::SexLabPPrism.map not found under build/ (/MAP did not run)"
              echo "  link line said: $mapflag"
              echo "  searched: $(pwd)/build for SexLabPPrism.map"
              echo "  *.map files actually present under build/:"
              find build -name '*.map' -type f 2>/dev/null || true
              exit 1
            fi
            cp "$map" parity-out/SexLabPPrism.map
            echo "  staged map: $map"
          else
            echo "  PRISM_LINK_MAP=0: no map staged (neutrality A/B)"
          fi

      - name: Report hashes
        shell: bash
        run: |
          sha256sum parity-out/SexLabPPrism-parity.dll | sed 's/^/  dll  /'
          if [ -f parity-out/SexLabPPrism.map ]; then
            sha256sum parity-out/SexLabPPrism.map | sed 's/^/  map  /'
            echo "  map symbols  $(grep -cE '^ [0-9a-f]{4}:[0-9a-f]{8,16} ' parity-out/SexLabPPrism.map || true)"
          fi
          echo "  commonlib  $COMMONLIB_REV"

      - uses: actions/upload-artifact@v4
        with:
          name: SexLabPPrism-0.6.1-parity
          path: parity-out/